# Builds the self-host image from this branch: release 2.0.0-beta.66 plus
# EXECUTOR_APP_UI_FRAME_ANCESTORS, EXECUTOR_MCP_DEFAULT_APPROVAL_MODE and appUi.launch, until upstream
# ships them. Every push republishes the VERSION tag, so bump it with any change to the image.
name: self-host image
on:
  push:
    branches: [selfhost/beta.66-frame-ancestors]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  VERSION: 2.0.0-beta.66-frame.3
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hosted/self-host/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: EXECUTOR_BUILD_VERSION=${{ env.VERSION }}
          tags: ghcr.io/zackleman/executor-selfhost:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/zackleman/executor
